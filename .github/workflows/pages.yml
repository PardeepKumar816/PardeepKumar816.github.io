name: Deploy portfolio to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.5
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --base-href /

      # Flutter does not fail the build when a declared asset folder is
      # missing; the 404 only shows up in the browser. Assert the artifact.
      - name: Verify build artifact
        run: |
          set -euo pipefail
          test -f build/web/index.html
          test -f build/web/robots.txt
          grep -q noindex build/web/index.html
          grep -oE '^\s+- assets/[^ ]*/' pubspec.yaml | tr -d ' -' > /tmp/dirs.txt
          while read -r dir; do
            if [ ! -d "build/web/assets/$dir" ]; then
              echo "asset folder missing from artifact: $dir"
              exit 1
            fi
          done < /tmp/dirs.txt

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4