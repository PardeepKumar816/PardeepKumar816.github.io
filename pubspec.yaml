name: protfolio
description: "Pardeep Kumar — Full Stack Mobile and Backend Engineer portfolio."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.3
  shared_preferences: ^2.0.15
  flutter_svg: ^1.1.6
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/images/projects/listcrime/
    - assets/images/projects/aitravel/
    - assets/images/projects/funotel/
    - assets/images/projects/interviewai/
    - assets/images/projects/saveabite/
    - assets/images/projects/chatsend/
    - assets/images/projects/litsports/
    - assets/images/projects/warranty/
    - assets/images/projects/thrillpay/
    - assets/images/projects/oceanicview/
    - assets/images/projects/pelican/


  fonts:
    - family: Agustina
      fonts:
        - asset: fonts/agustina/agustina.otf

    - family: Montserrat
      fonts:
        - asset: fonts/montserrat/montserrat.ttf

    - family: Poppins
      fonts:
        - asset: fonts/poppins/Poppins-Regular.ttf
        - asset: fonts/poppins/Poppins-Light.ttf
        - asset: fonts/poppins/Poppins-Bold.ttf
          weight: 900
        - asset: fonts/poppins/Poppins-Medium.ttf
          weight: 300
        - asset: fonts/poppins/Poppins-SemiBold.ttf
          weight: 500
        - asset: fonts/poppins/Poppins-Italic.ttf
          style: italic

